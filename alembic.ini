# alembic.ini — Alembic configuration for Multi-Agent Orchestration System
#
# The DATABASE_URL is NOT stored here to prevent secret leakage.
# migrations/env.py reads it from src.config.settings.sync_database_url at
# runtime, which in turn honours the DATABASE_URL env var or constructs it
# from POSTGRES_* env vars defined in .env.
#
# A generic, single database configuration.

[alembic]
# Path to migration scripts (relative to this file).
script_location = %(here)s/migrations

# Template used to generate migration file names.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path will be prepended with this value, allowing project imports.
prepend_sys_path = .

# Path separator for version_locations / prepend_sys_path.
path_separator = os

# Placeholder URL — overridden at runtime by env.py.
# Do NOT put real credentials here.
sqlalchemy.url = postgresql://placeholder

[post_write_hooks]
# Hook examples (commented out):
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
