[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-orchestration-system"
version = "0.1.0"
description = "Multi-Agent Orchestration System with LangGraph"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "psycopg2-binary>=2.9.0",
    "jsonschema>=4.20.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
filterwarnings = [
    # SQLAlchemy emits this when a nested transaction is rolled back after an
    # IntegrityError invalidates the outer connection transaction.  This is
    # expected and harmless in the rollback-based test isolation pattern.
    "ignore:transaction already deassociated from connection:sqlalchemy.exc.SAWarning",
]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Alembic migration files are machine-generated; line length not enforced.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
